# Every save in /admin (a commit to main) rebuilds the page and publishes it to https://v3.xlink-landing.pages.dev
name: Build and deploy XLINK landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-v3
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3
      - run: python -I cms/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Cloudflare Pages (alias v3)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=xlink-landing --branch=v3 --commit-dirty=true
