<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị nội dung XLINK</title>
  <link rel="icon" type="image/png" href="../assets/img/brand/favicon-32.png">
  <link href="config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script>
    // when the GitHub login window saves the session (see functions/api/callback.js), reload into the CMS
    window.addEventListener("storage", function (e) {
      if (e.key === "decap-cms-user" && e.newValue) window.location.reload();
    });
  </script>
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
</body>
</html>
