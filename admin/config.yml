# Decap CMS – trang quản trị nội dung XLINK (/admin)
backend:
  name: github
  repo: Tay-Tran/xlink-landing
  branch: main
  base_url: https://v3.xlink-landing.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    update: "Cập nhật nội dung: {{slug}}"
# chạy thử trên máy: npx decap-server (cùng thư mục repo) rồi mở /admin
local_backend: true
locale: vi
publish_mode: simple
media_folder: assets/img/uploads   # ảnh chị tải lên nằm ở đây (bản gốc); trang dùng bản đã nén
public_folder: /assets/img/uploads
collections:
  - name: noi-dung
    label: Nội dung trang
    description: "Sửa chữ tiếng Việt và tiếng Anh theo từng khối, đổi ảnh ở khối Hình ảnh. Giữ nguyên các thẻ như <b>…</b>, <br>. Bấm Publish để lưu, trang tự cập nhật sau 1–2 phút."
    editor:
      preview: false
    files:
      - name: "00-seo"
        label: "SEO – tiêu đề tab, mô tả khi chia sẻ"
        file: "content/00-seo.json"
        fields:
          - { label: "Khối", name: "khoi", widget: "hidden" }
          - label: "Các đoạn chữ"
            name: "items"
            widget: "list"
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.loai}} · {{fields.vi}}"
            fields:
              - { label: "Mã", name: "id", widget: "hidden" }
              - { label: "Loại", name: "loai", widget: "hidden" }
              - { label: "Tiếng Việt", name: "vi", widget: "text" }
              - { label: "English", name: "en", widget: "text", required: false, hint: "Để trống thì trang tiếng Anh dùng chữ tiếng Việt" }
      - name: "01-menu"
        label: "Menu trên cùng"
        file: "content/01-menu.json"
        fields:
          - { label: "Khối", name: "khoi", widget: "hidden" }
