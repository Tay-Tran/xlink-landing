              - { label: "Loại", name: "loai", widget: "hidden" }
              - { label: "Tiếng Việt", name: "vi", widget: "text" }
              - { label: "English", name: "en", widget: "text", required: false, hint: "Để trống thì trang tiếng Anh dùng chữ tiếng Việt" }
      - name: "02-hero"
